<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>海窗书桌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
/* 视觉母版 · 海窗书桌
   版式：全屏 3D 场景为主体，2D UI 只贴边（顶部一条、底部一条），聚焦时底部升起一张轻玻璃卡。
   颜色随场景昼夜切换（body.day / body.night），不跟随系统主题。 */
:root{
  --bg:#cfe4ec;
  --ink:#24313c;
  --ink-2:#5b6a77;
  --ink-3:rgba(36,49,60,.42);
  --glass:rgba(255,255,255,.34);
  --glass-2:rgba(255,255,255,.58);
  --glass-edge:rgba(255,255,255,.72);
  --accent:#d97f95;
  --accent-soft:rgba(217,127,149,.16);
  --on-accent:#ffffff;
  --shade:0 10px 34px rgba(34,72,98,.16);
  --f-body:"Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-title:"Noto Serif SC","Songti SC","STSong",serif;
  --f-script:"Cormorant Garamond","Iowan Old Style","Times New Roman",serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
body.night{
  --bg:#0c1426;
  --ink:#eef1f8;
  --ink-2:#aeb8cc;
  --ink-3:rgba(238,241,248,.45);
  --glass:rgba(22,30,52,.38);
  --glass-2:rgba(26,34,60,.66);
  --glass-edge:rgba(255,255,255,.14);
  --accent:#f0a3b4;
  --accent-soft:rgba(240,163,180,.16);
  --on-accent:#2a1820;
  --shade:0 10px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color 1.6s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* 顶部与四角柔光：保证状态栏可读，同时像镜头边缘的暗角 */
.veil{position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,0) 14%),
    radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 62%,rgba(30,52,70,.16) 100%);
  transition:opacity 1.6s}
body.night .veil{background:
    linear-gradient(to bottom,rgba(8,12,24,.45),rgba(8,12,24,0) 16%),
    radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(4,6,14,.42) 100%)}

/* ---------- 顶部 ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.top > *{pointer-events:auto}
.who{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--glass);
  border:1px solid var(--glass-edge);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--shade);transition:background-color 1.6s,border-color 1.6s}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-title);font-size:14px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#f9d3dc,#d9879c 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65);position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#7fcf9a;box-shadow:0 0 0 2px var(--glass-2)}
.who-t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.who-t b{font-weight:500;font-size:14px;letter-spacing:.02em}
.who-t i{font-style:normal;font-size:11px;color:var(--ink-2)}
.dn{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shade);transition:background-color 1.6s,border-color 1.6s}
.dn button{position:relative;z-index:1;width:36px;height:30px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2);transition:color .5s}
.dn button[aria-pressed="true"]{color:var(--ink)}
.dn svg{width:17px;height:17px}
.dn-knob{position:absolute;top:3px;left:3px;width:36px;height:30px;border-radius:999px;background:var(--glass-2);box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .7s var(--ease),background-color 1.6s}
body.night .dn-knob{transform:translateX(36px)}

/* ---------- 物件上的小标记 ---------- */
.tags{position:fixed;inset:0;z-index:3;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;pointer-events:auto;transform:translate(-50%,-50%);
  transition:opacity .5s var(--ease);will-change:transform}
.tag .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(255,255,255,.28),0 1px 6px rgba(0,0,0,.18);position:relative;flex:none}
.tag .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.7);animation:ping 2.8s var(--ease) infinite}
.tag .tx{font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--glass-2);border:1px solid var(--glass-edge);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .45s var(--ease),transform .45s var(--ease),background-color 1.6s}
.tags.intro .tag .tx,.tag:hover .tx,.tag.hot .tx{opacity:1;transform:none}
.tags.hide .tag{opacity:0;pointer-events:none}
.tag.off{opacity:0;pointer-events:none}
body.night .tag .dot{background:#ffe2b8;box-shadow:0 0 0 3px rgba(255,214,160,.2),0 0 10px rgba(255,200,140,.6)}
body.night .tag .dot::after{border-color:rgba(255,220,170,.6)}
@keyframes ping{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(1.5);opacity:0}}

/* ---------- 浮动消息 ---------- */
.float{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  pointer-events:none;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.float .msg{pointer-events:auto;max-width:74%;padding:8px 13px;font-size:13.5px;border-radius:18px 18px 18px 6px;background:var(--glass-2);border:1px solid var(--glass-edge);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shade);line-height:1.5;font-size:14px;
  animation:rise .7s var(--ease) both;transition:background-color 1.6s,border-color 1.6s,opacity .6s}
.float .msg.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--accent);color:var(--on-accent);border-color:transparent}
.float .msg.old{opacity:.55}
.float .meta{pointer-events:auto;font-size:11px;color:var(--ink-2);padding-left:4px;display:flex;gap:6px;align-items:center;animation:rise .7s var(--ease) both}
.float .meta .open{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-3)}
.typing{display:inline-flex;gap:4px;padding:11px 13px;border-radius:18px 18px 18px 6px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 输入条 ---------- */
.composer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;display:flex;align-items:center;gap:8px;padding:6px;
  border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:var(--shade);transition:opacity .5s var(--ease),transform .6s var(--ease),background-color 1.6s,border-color 1.6s}
.composer .round{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);color:var(--ink-2)}
.composer .round svg{width:18px;height:18px}
.composer input{flex:1;min-width:0;height:38px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:0 4px;outline:none}
.composer input::placeholder{color:var(--ink-3)}
.composer .send{height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:500;font-size:14px;letter-spacing:.06em;flex:none;transition:transform .2s,background-color 1.6s}
.composer .send:active{transform:scale(.95)}

/* ---------- 展开的聊天 ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;height:58%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;
  background:var(--glass-2);border-top:1px solid var(--glass-edge);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 -10px 40px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .7s var(--ease),background-color 1.6s;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
body.chat .sheet{transform:none}
.sheet .grab{align-self:center;width:44px;height:22px;display:grid;place-items:center}
.sheet .grab::before{content:"";width:38px;height:4px;border-radius:4px;background:var(--ink-3)}
.sheet .list{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.sheet .day-sep{align-self:center;font-size:11px;color:var(--ink-2);letter-spacing:.1em;padding:6px 0}
.sheet .b{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--glass-2);border:1px solid var(--glass-edge);line-height:1.55}
.sheet .b.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:transparent;border-radius:18px 18px 6px 18px}
body.chat .float{opacity:0;transform:translateY(20px);pointer-events:none}
body.chat .float *{pointer-events:none}

/* ---------- 聚焦卡片 ---------- */
.panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:7;max-width:460px;margin:0 auto;padding:16px 18px 18px;border-radius:26px;
  background:var(--glass-2);border:1px solid var(--glass-edge);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--shade);
  opacity:0;transform:translateY(24px) scale(.98);pointer-events:none;transition:opacity .55s var(--ease),transform .7s var(--ease),background-color 1.6s}
body.focus .panel{opacity:1;transform:none;pointer-events:auto;transition-delay:.35s}
body.focus .float,body.focus .composer{opacity:0;transform:translateY(24px);pointer-events:none}
body.focus .float *{pointer-events:none}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.p-eye{font-family:var(--f-script);font-style:italic;font-size:17px;color:var(--accent);letter-spacing:.02em;line-height:1}
.p-eye b{font-family:var(--f-body);font-style:normal;font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--ink-2);margin-left:6px}
.p-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--ink-2);flex:none}
.p-x svg{width:14px;height:14px}
.p-title{font-family:var(--f-title);font-size:22px;font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
.p-sub{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.5}
.p-body{margin-top:10px;line-height:1.65;font-size:14px}
.p-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);font-size:13px;transition:background-color .3s,color .3s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn{padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:500;font-size:13.5px;letter-spacing:.04em}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-edge)}
.bar{position:relative;height:4px;border-radius:4px;background:var(--accent-soft);margin-top:14px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:8px}
.ctrl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ctrl button svg{width:20px;height:20px}
.ctrl .play{width:54px;height:54px;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(217,127,149,.4)}
.ctrl .play svg{width:22px;height:22px}
.q{text-align:center;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.lines{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{display:flex;gap:10px;align-items:baseline;line-height:1.55}
.lines li small{color:var(--ink-2);font-size:11px;flex:none;font-variant-numeric:tabular-nums;width:46px}
.rows{display:flex;flex-direction:column;margin-top:6px}
.rows button{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px dashed var(--ink-3);text-align:left}
.rows button:last-child{border-bottom:0}
.rows span small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.rows svg{width:14px;height:14px;color:var(--ink-3)}

.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity 1.2s var(--ease),visibility 1.2s}
.loader span{font-family:var(--f-script);font-style:italic;font-size:20px;color:var(--ink-2);letter-spacing:.04em}
body.ready .loader{opacity:0;visibility:hidden}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:9;transform:translate(-50%,-8px);opacity:0;padding:7px 14px;border-radius:999px;
  background:var(--glass-2);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;color:var(--ink-2);transition:opacity .4s,transform .4s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.float{left:50%;right:auto;width:440px;transform:translateX(-50%)}.composer{left:50%;right:auto;width:460px;transform:translateX(-50%)}
  body.focus .composer{transform:translate(-50%,24px)}body.focus .float,body.chat .float{transform:translate(-50%,20px)}.sheet{max-width:520px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.2s!important}}
</style>
</head>
<body class="day">
<canvas id="c" tabindex="0" aria-label="海边书桌，可以点桌上的物件"></canvas>
<div class="veil"></div>

<header class="top" id="top">
  <button class="who" id="who" aria-label="打开和沐沐的聊天">
    <span class="av">沐</span>
    <span class="who-t"><b>沐沐</b><i id="whoStatus">在海边 · 在线</i></span>
  </button>
  <div class="dn" role="group" aria-label="白天与夜晚">
    <span class="dn-knob"></span>
    <button id="btnDay" aria-pressed="true" aria-label="白天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/></svg></button>
    <button id="btnNight" aria-pressed="false" aria-label="夜晚"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z"/></svg></button>
  </div>
</header>

<div class="tags intro" id="tags"></div>

<section class="float" id="float" aria-live="polite">
  <div class="msg">唱片我放好了。想听的时候，碰一下留声机就行。</div>
  <div class="meta"><span>沐沐 · 刚刚</span><button class="open" id="openChat">展开聊天</button></div>
</section>

<section class="sheet" id="sheet" aria-label="聊天记录">
  <button class="grab" id="grab" aria-label="收起聊天"></button>
  <div class="list" id="list">
    <div class="day-sep">今天</div>
    <div class="b">早。窗开着，今天海风有点凉。</div>
    <div class="b me">那你把八音盒盖上，别进沙子</div>
    <div class="b">盖了一半。留了条缝，让它听海。</div>
    <div class="b">唱片我放好了。想听的时候，碰一下留声机就行。</div>
  </div>
</section>

<section class="panel" id="panel" aria-live="polite"></section>

<footer class="composer" id="composer">
  <button class="round" aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <input id="msgInput" type="text" placeholder="说点什么…" autocomplete="off" enterkeyhint="send">
  <button class="send" id="sendBtn">发送</button>
</footer>

<div class="toast" id="toast"></div>
<div class="loader"><span>opening the window…</span></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 基础
   ========================================================= */
const $ = s => document.querySelector(s);
const canvas = $('#c');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.04, 6000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const rng = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; });
const R = rng(7);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function canvasTex(w, h, draw, { srgb = true, wrap = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (wrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function mesh(geo, mat, { cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = receive; return m;
}
const lathe = (pts, seg = 48) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);

function woodTex(base, dark, { w = 1024, h = 512, lines = 160, wob = 7, seed = 3, knots = 2 } = {}) {
  return canvasTex(w, h, (g) => {
    const r = rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {          // 大块色差
      const y = r() * h, gr = g.createLinearGradient(0, y - 80, 0, y + 80);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, r() > .5 ? 'rgba(255,240,220,.10)' : 'rgba(90,50,20,.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, y - 80, w, 160);
    }
    g.strokeStyle = dark;
    for (let i = 0; i < lines; i++) {      // 木纹
      const y0 = r() * h, f = .002 + r() * .004, ph = r() * 6.28, amp = wob * (.4 + r());
      g.globalAlpha = .035 + r() * .12; g.lineWidth = .6 + r() * 2.2; g.beginPath();
      for (let x = 0; x <= w; x += 8) { const y = y0 + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.3 + ph * 2) * amp * .3; x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    for (let k = 0; k < knots; k++) {     // 木节
      const cx = r() * w, cy = r() * h;
      for (let j = 0; j < 9; j++) { g.globalAlpha = .07; g.lineWidth = 1.2; g.beginPath(); g.ellipse(cx, cy, 6 + j * 7, 2 + j * 2.2, 0, 0, 7); g.stroke(); }
    }
    g.globalAlpha = 1;
  }, { wrap: true });
}

});

// 相框里的画：《三亚，热浪与月光》——两位女主的背影，坐在月光下的海边
const artTex = canvasTex(720, 960, (g, w, h) => {
  const m = 34; // 留白
  g.fillStyle = '#f7f1ea'; g.fillRect(0, 0, w, h);
  g.save(); g.beginPath(); g.rect(m, m, w - 2 * m, h - 2 * m - 90); g.clip();
  const H = h - 2 * m - 90, top = m, hz = top + H * .56;
  const sky = g.createLinearGradient(0, top, 0, hz);
  sky.addColorStop(0, '#1c2350'); sky.addColorStop(.45, '#4a3f79'); sky.addColorStop(.8, '#c9849c'); sky.addColorStop(1, '#f2b49a');
  g.fillStyle = sky; g.fillRect(0, top, w, hz - top);
  // 星
  const r = rng(21);
  for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,248,235,${.25 + r() * .6})`; const s = r() * 2.2; g.fillRect(m + r() * (w - 2 * m), top + r() * H * .35, s, s); }
  // 月
  const mx = w * .68, my = top + H * .2;
  const glow = g.createRadialGradient(mx, my, 10, mx, my, 170); glow.addColorStop(0, 'rgba(255,240,215,.55)'); glow.addColorStop(1, 'rgba(255,240,215,0)');
  g.fillStyle = glow; g.fillRect(0, top, w, H);
  g.fillStyle = '#fff4dc'; g.beginPath(); g.arc(mx, my, 52, 0, 7); g.fill();
  g.fillStyle = 'rgba(230,205,170,.35)'; g.beginPath(); g.arc(mx - 14, my + 8, 12, 0, 7); g.arc(mx + 16, my - 12, 8, 0, 7); g.fill();
  // 海
  const sea = g.createLinearGradient(0, hz, 0, top + H);
  sea.addColorStop(0, '#5d5a8c'); sea.addColorStop(1, '#1c2348');
  g.fillStyle = sea; g.fillRect(0, hz, w, top + H - hz);
  for (let i = 0; i < 70; i++) { const y = hz + 4 + Math.pow(r(), 1.6) * H * .32; const spread = 10 + (y - hz) * .6; const x = mx + (r() - .5) * spread; g.fillStyle = `rgba(255,236,205,${.25 + r() * .55})`; g.fillRect(x, y, 6 + r() * 26, 1.6); }
  // 沙滩
  g.fillStyle = '#2a2547'; g.beginPath(); g.moveTo(m, top + H * .86); g.bezierCurveTo(w * .35, top + H * .8, w * .6, top + H * .84, w - m, top + H * .82); g.lineTo(w - m, top + H); g.lineTo(m, top + H); g.fill();
  g.strokeStyle = 'rgba(255,236,205,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(m, top + H * .855); g.bezierCurveTo(w * .35, top + H * .795, w * .6, top + H * .835, w - m, top + H * .815); g.stroke();
  // 椰树
  g.strokeStyle = '#181633'; g.fillStyle = '#181633'; g.lineWidth = 11; g.lineCap = 'round';
  g.beginPath(); g.moveTo(w * .12, top + H * .9); g.bezierCurveTo(w * .14, top + H * .6, w * .2, top + H * .45, w * .27, top + H * .33); g.stroke();
  const cx0 = w * .27, cy0 = top + H * .33;
  for (const [a, L] of [[-2.6, 150], [-2.1, 170], [-1.4, 120], [-.6, 160], [-.1, 150], [.5, 130], [-3.1, 120]]) {
    g.beginPath(); g.moveTo(cx0, cy0);
    const ex = cx0 + Math.cos(a) * L, ey = cy0 + Math.sin(a) * L * .55 + L * .35;
    g.quadraticCurveTo(cx0 + Math.cos(a) * L * .55, cy0 + Math.sin(a) * L * .55 - 20, ex, ey);
    g.lineWidth = 3; g.stroke();
    for (let t = .15; t < 1; t += .07) {
      const px = cx0 + (ex - cx0) * t, py = cy0 + (ey - cy0) * t + Math.sin(t * 3) * -22 * (1 - t);
      g.lineWidth = 2.2; g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a + 1.2) * 26 * (1 - t * .6), py + 22 * (1 - t * .5)); g.moveTo(px, py); g.lineTo(px + Math.cos(a - 1.2) * 22 * (1 - t * .6), py + 18 * (1 - t * .5)); g.stroke();
    }

  // 两个女孩的背影：长发，靠在一起看月亮
  const ink = '#14122b';
  function girl(x, y, s, lean, hair) {
    g.save(); g.translate(x, y); g.rotate(lean); g.scale(s, s); g.fillStyle = ink;
    g.beginPath(); g.moveTo(-34, 0); g.bezierCurveTo(-36, -40, -24, -64, 0, -66); g.bezierCurveTo(24, -64, 36, -40, 34, 0); g.closePath(); g.fill(); // 肩背

});

const palmTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(51);
  const base = [w * .98, h * .02];
  const fronds = [[-2.55, 820], [-2.2, 900], [-1.85, 760], [-2.85, 640], [-1.55, 560]];
  for (const [a, L] of fronds) {
    const ex = base[0] + Math.cos(a) * L, ey = base[1] - Math.sin(a) * L * .55 + L * .32;
    const mx = (base[0] + ex) / 2 + 40, my = (base[1] + ey) / 2 - 90;
    g.strokeStyle = '#4f7448'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(...base); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
    for (let t = .12; t <= 1; t += .028) {
      const px = (1 - t) * (1 - t) * base[0] + 2 * (1 - t) * t * mx + t * t * ex;
      const py = (1 - t) * (1 - t) * base[1] + 2 * (1 - t) * t * my + t * t * ey;
      const tx = 2 * (1 - t) * (mx - base[0]) + 2 * t * (ex - mx), ty = 2 * (1 - t) * (my - base[1]) + 2 * t * (ey - my);
      const ang = Math.atan2(ty, tx);
      const len = (150 + r() * 40) * Math.sin(Math.PI * Math.min(1, t * 1.05)) + 30;
      for (const s of [1, -1]) {
        const la = ang + s * (1.0 + r() * .25) + .35;
        const lx = px + Math.cos(la) * len, ly = py + Math.sin(la) * len + len * .35;
        const gr = g.createLinearGradient(px, py, lx, ly); gr.addColorStop(0, '#4a7a45'); gr.addColorStop(1, '#7da868');
        g.strokeStyle = gr; g.lineWidth = 9 * (1 - t * .5); g.beginPath(); g.moveTo(px, py); g.quadraticCurveTo((px + lx) / 2 + s * 8, (py + ly) / 2 - 18, lx, ly); g.stroke();
      }
    }
  }
}, {});

const U = {
  uTime: { value: 0 }, uNight: { value: 0 },
  uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uHaze: { value: new THREE.Color() },
  uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3(.36, .13, -1).normalize() },
  uMoonDir: { value: new THREE.Vector3(-.2, .052, -1).normalize() },
};
const SKY_GLSL = /* glsl */`
  uniform vec3 uZenith, uHorizon, uHaze, uSunDir, uMoonDir; uniform float uNight, uTime;
  vec3 skyCol(vec3 d){
    float h = max(d.y, 0.0);
    vec3 c = mix(uHorizon, uZenith, pow(smoothstep(0.0, 0.55, h), 0.55));
    c = mix(c, uHaze, exp(-h * 70.0) * 0.6);
    float s = max(dot(d, uSunDir), 0.0);
    c += vec3(1.0, .86, .7) * (pow(s, 6.0) * .22 + pow(s, 60.0) * .35) * (1.0 - uNight);
    float m = max(dot(d, uMoonDir), 0.0);
    c += vec3(.6, .68, 1.0) * (pow(m, 24.0) * .12 + pow(m, 900.0) * .45) * uNight;
    return c;
  }`;
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 64, 32), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: SKY_GLSL + `
  varying vec3 vDir;
  float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
  void main(){
    vec3 d = normalize(vDir);
    vec3 c = skyCol(d);
    float sun = smoothstep(.99955, .9998, dot(d, uSunDir));
    c = mix(c, vec3(1.25,1.15,1.0)*1.6, sun * (1.0 - uNight));
    float md = dot(d, uMoonDir);
    float moon = smoothstep(.99968, .99978, md);
    vec3 moonC = vec3(1.0,.96,.88) * (1.5 - .25 * smoothstep(.99985,.99968, md + .00003*sin(d.x*1400.0)));
    c = mix(c, moonC, moon * uNight);
    if (d.y > .015) {
      vec3 p = d * 260.0; vec3 cell = floor(p); float r = hash(cell);
      if (r > .975) { vec3 f = fract(p) - .5; float st = smoothstep(.16, .0, length(f)); c += vec3(1.0,.95,.85) * st * uNight * (.55 + .45 * sin(uTime * (1.0 + r * 3.0) + r * 80.0)) * smoothstep(.015,.12,d.y); }
    }
    gl_FragColor = vec4(c, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`
}));

const sea = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000, 1, 1), new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: SKY_GLSL + `
  uniform vec3 uDeep, uShallow;
  varying vec3 vW;
  vec2 waves(vec2 p, float t){
    vec2 g = vec2(0.0); vec2 d = normalize(vec2(.3, 1.0)); float a = 1.0, k = .32;
    for (int i = 0; i < 9; i++){
      float w = sqrt(9.8 * k);
      g += a * d * cos(dot(d, p) * k + w * t * .55 + float(i) * 1.7);
      d = vec2(d.x * .737 - d.y * .676, d.x * .676 + d.y * .737);
      k *= 1.62; a *= .78;
    }
    return g;
  }
  void main(){
    vec3 toP = vW - cameraPosition; float dist = length(toP); vec3 V = toP / dist;
    vec2 g = waves(vW.xz, uTime) * .085;
    float fade = smoothstep(60.0, 1600.0, dist);
    vec3 n = normalize(vec3(-g.x * (1.0 - fade * .85), 1.0, -g.y * (1.0 - fade * .85)));
    vec3 Rf = reflect(V, n); Rf.y = abs(Rf.y);
    float fres = .03 + .97 * pow(1.0 - max(dot(-V, n), 0.0), 5.0);
    float depthMix = smoothstep(-.5, .6, g.x + g.y);
    vec3 water = mix(uDeep, uShallow, depthMix * .55 + .2);
    vec3 c = mix(water, skyCol(Rf), clamp(fres * 1.15, 0.0, 1.0));
    float sp = pow(max(dot(Rf, uSunDir), 0.0), 700.0);
    float glint = smoothstep(.55, 1.0, sin(vW.x * 3.1 + uTime * 2.3) * sin(vW.z * 2.7 - uTime * 1.9));
    c += vec3(1.0,.93,.8) * (sp * 9.0 + sp * glint * 18.0) * (1.0 - uNight);
    float mp = pow(max(dot(Rf, uMoonDir), 0.0), 1400.0);
    c += vec3(1.0,.93,.8) * (mp * 1.2 + mp * glint * 3.0) * uNight;
    c = mix(c, uHaze, smoothstep(250.0, 2600.0, dist) * .92);
    gl_FragColor = vec4(c, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`
}));

  for (const s of mb.sparks) {
    const u = s.userData; const ph = (u.ph + t * u.sp * (singing ? 2 : 1)) % 1;
    s.position.set(Math.cos(u.a + t * .3) * u.r, .09 + ph * .16, Math.sin(u.a + t * .3) * u.r);
    s.material.opacity = Math.sin(ph * Math.PI) * (singing ? .95 : .45) * (.5 + .5 * Math.sin(t * 7 + u.a * 3));
    s.scale.setScalar(.008 + .01 * Math.sin(ph * Math.PI));
  }

  // 抽屉
  const dz = focus === 'drawer' ? .5 : .325;
  drawer.position.z += ((focus === 'drawer' ? .43 : .325) - drawer.position.z) * Math.min(1, dt * 3);

  // 茶的热气
  steam.forEach((s, i) => {
    const p = (s.userData.ph + t * .12) % 1;
    s.position.set(Math.sin(p * 6 + i) * .012, .07 + p * .16, Math.cos(p * 5 + i) * .008);
    s.material.opacity = Math.sin(p * Math.PI) * .22 * (1 - night * .35);
    s.scale.set(.03 + p * .05, .07 + p * .08, 1); s.material.rotation = Math.sin(p * 4 + i) * .5;
  });

  // 窗帘
  for (const cu of curtains) {
    const pos = cu.c.geometry.attributes.position, b = cu.base;
    for (let i = 0; i < pos.count; i++) {
      const x = b[i * 3], y = b[i * 3 + 1];
      const fromTop = (cu.h / 2 - y) / cu.h;
      const fold = Math.sin((x / cu.w) * Math.PI * 9) * .022;
      const wind = (Math.sin(t * .9 + y * 2.2 + x * 3) * .5 + Math.sin(t * 1.7 + x * 7) * .2) * .05 * fromTop * fromTop;
      pos.setZ(i, fold + wind + .06 * fromTop * fromTop * (.6 + .4 * Math.sin(t * .5)));
      pos.setX(i, x + Math.sin(t * .8 + y) * .015 * fromTop * cu.side);
    }
    pos.needsUpdate = true; cu.c.geometry.computeVertexNormals();
  }
  // 棕榈、盆栽、鸟、船、云
  palm.rotation.z = .05 + Math.sin(t * .7) * .035 + Math.sin(t * 1.9) * .01;
  palm.rotation.x = .12 + Math.sin(t * .5) * .03;
  leaves.forEach(l => { l.lf.quaternion.copy(l.q); l.lf.rotateX(Math.sin(t * 1.3 + l.ph) * .08); });
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 2200) c.position.x = -2200; }
  boat.position.x += dt * .9; if (boat.position.x > 200) boat.position.x = -200;
  boat.position.y = SEA_Y + Math.sin(t * .8) * .25; boat.rotation.z = Math.sin(t * .7) * .04;
  const bx = ((t * 1.6) % 80) - 40;
  birds.forEach((bd, i) => {
    const flap = Math.sin(t * 6 + bd.ph) * .35 * bd.sz, s = bd.sz;
    const c = V3.set(bx + bd.off.x, 6 + bd.off.y + Math.sin(t * .5 + i) * .6, -38 + bd.off.z);
    const a = bd.l.geometry.attributes.position;
    a.setXYZ(0, c.x - s, c.y + flap, c.z); a.setXYZ(1, c.x, c.y - .12 * s, c.z); a.setXYZ(2, c.x + s, c.y + flap, c.z); a.needsUpdate = true;
  });
  beacon.material.opacity = night * (.5 + .5 * Math.pow(Math.max(0, Math.sin(t * 1.3)), 6)) * .9;
  // 串灯微闪
  bulbs.forEach(b => b.halo.material.opacity = night * (.55 + .2 * Math.sin(t * 2 + b.ph)));
  // 浮尘
  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < DUST; i++) {
    const s = dustSeed[i];
    dp.array[i * 3] += Math.sin(t * .3 + s) * .00012;
    dp.array[i * 3 + 1] += Math.sin(t * .2 + s * 2) * .0001 + .00004;
    if (dp.array[i * 3 + 1] > 1.9) dp.array[i * 3 + 1] = .8;
  }
  dp.needsUpdate = true;

  // 标签位置
  for (const it of Object.values(interactive)) {
    worldAnchor.copy(it.anchor); it.group.localToWorld(worldAnchor); worldAnchor.project(camera);
    const vis = worldAnchor.z < 1 && Math.abs(worldAnchor.x) < .92 && worldAnchor.y > -.62 && worldAnchor.y < .85;
    it.tag.classList.toggle('off', !vis);
    it.tag.style.transform = `translate(${(worldAnchor.x * .5 + .5) * innerWidth}px, ${(-worldAnchor.y * .5 + .5) * innerHeight}px) translate(-50%,-50%)`;
  }
  // 播放进度（演示）
  if (playingNow) { const p = $('#prog'), tn = $('#tNow'); if (p) { const secs = (114 + (now % 70)) | 0; p.style.width = (secs / 185 * 100).toFixed(1) + '%'; tn.textContent = `${String(secs / 60 | 0).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`; } }

  composer.render(dt);
  last = t;
  requestAnimationFrame(frame);
}

/* =========================================================
   14. 启动
   ========================================================= */
const hash = location.hash.replace('#', '');
const hr = new Date().getHours();
setNight(hash === 'night' ? true : hash === 'day' ? false : (hr >= 18 || hr < 6), true);
resize();
applyEnv(night);
lampOn = night > .5 ? 1 : 0;
requestAnimationFrame(() => { frame(); setTimeout(() => document.body.classList.add('ready'), 150); });
window.__vm = { ready: true, setNight, activate, goHome, get focus() { return focus; } };
</script>
