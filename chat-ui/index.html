<title>青灯对话</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of conversations + one reading column; rail becomes a drawer under 760px */
:root {
  --bg: #e9eeec;          /* 月白 ground */
  --surface: #f7f9f8;
  --rail: #dfe6e3;
  --ink: #1b282b;
  --muted: #5d6d6f;
  --line: #cfd9d6;
  --accent: #2c6b5e;      /* 竹青 */
  --accent-ink: #f4faf8;
  --user-bubble: #d5e6e0;
  --code-bg: #e2e9e6;
  --danger: #a23b2a;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a1c; --surface: #172224; --rail: #0d1517; --ink: #e1e9e7; --muted: #8fa19f;
    --line: #26353a; --accent: #7cc2b0; --accent-ink: #0d1d19; --user-bubble: #1f3a35;
    --code-bg: #0e1719; --danger: #e48a78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a1c; --surface: #172224; --rail: #0d1517; --ink: #e1e9e7; --muted: #8fa19f;
  --line: #26353a; --accent: #7cc2b0; --accent-ink: #0d1d19; --user-bubble: #1f3a35;
  --code-bg: #0e1719; --danger: #e48a78; color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 268px 1fr; }

/* ---------- rail ---------- */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 18px 14px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.seal { width: 34px; height: 34px; flex: none; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1; }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.new-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 10px;
  border: 1px dashed var(--muted); background: transparent; font-size: 14px; transition: background .15s, border-color .15s; }
.new-btn:hover { background: var(--surface); border-color: var(--accent); border-style: solid; }
.rail-label { font-size: 11px; letter-spacing: .14em; color: var(--muted); padding-inline: 8px; text-transform: uppercase; }
.convs { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.conv { display: flex; align-items: center; gap: 6px; border-radius: 9px; }
.conv button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 9px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: var(--muted); }
.conv.active button.open { color: var(--ink); background: var(--surface); font-weight: 500; }
.conv button.open:hover { color: var(--ink); }
.conv button.del { background: none; border: 0; color: var(--muted); padding: 4px 8px; opacity: 0; font-size: 16px; line-height: 1; }
.conv:hover button.del, .conv button.del:focus-visible { opacity: 1; }
.conv button.del:hover { color: var(--danger); }
.rail-foot { font-size: 12px; color: var(--muted); padding-inline: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.topbar h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 17px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-wrap: balance; }
.status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.live .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.thread { max-width: 760px; margin: 0 auto; padding: 28px 24px 12px; display: flex; flex-direction: column; gap: 26px; }

.empty { text-align: center; padding-block: 8vh 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty .seal { width: 56px; height: 56px; font-size: 30px; border-radius: 12px; }
.empty h3 { margin: 0; font-family: var(--f-display); font-size: 26px; font-weight: 700; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; transition: border-color .15s; }
.chip:hover { border-color: var(--accent); }

.msg { display: flex; gap: 14px; min-width: 0; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
.msg .seal { width: 30px; height: 30px; font-size: 15px; border-radius: 7px; margin-top: 2px; }
.msg.user { justify-content: flex-end; }
.msg.user .body { background: var(--user-bubble); padding: 10px 16px; border-radius: var(--r) var(--r) 4px var(--r); max-width: 82%; white-space: pre-wrap; }
.msg.bot .body { flex: 1; min-width: 0; }
.body > :first-child { margin-top: 0; }
.body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 .8em; }
.body h1, .body h2, .body h3 { font-family: var(--f-display); line-height: 1.35; margin: 1.1em 0 .5em; font-size: 1.12em; }
.body ul, .body ol { padding-left: 1.4em; margin: 0 0 .8em; }
.body a { color: var(--accent); }
.body code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.body pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .9em; }
.body pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
.body blockquote { margin: 0 0 .8em; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.meta { margin-top: 8px; display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta button { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; }
.meta button:hover { color: var(--accent); }
.thinking { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.err { color: var(--danger); font-size: 13px; margin-top: 6px; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; }

/* ---------- composer ---------- */
.composer-wrap { padding: 8px 24px calc(18px + env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 10px 10px 10px 16px; display: flex; align-items: flex-end; gap: 10px; transition: border-color .15s, box-shadow .15s; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
  font: inherit; line-height: 1.6; max-height: 200px; padding: 6px 0; }
.composer textarea::placeholder { color: var(--muted); }
.send { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; transition: transform .1s, opacity .15s; }
.send:disabled { opacity: .35; cursor: default; }
.send:not(:disabled):active { transform: scale(.94); }
.send svg { width: 18px; height: 18px; }
.hint { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

.scrim { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(82vw, 300px); z-index: 20; transform: translateX(-100%); transition: transform .22s ease;
    padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .app.drawer .rail { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 10; }
  .menu-btn { display: inline-block; }
  .topbar { padding: 12px 16px; }
  .thread { padding: 20px 16px 8px; }
  .composer-wrap { padding-inline: 16px; }
  .msg.user .body { max-width: 90%; }
  .msg .seal { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <aside class="rail" aria-label="对话列表">
    <div class="brand"><div class="seal" aria-hidden="true">言</div><h1>青灯</h1></div>
    <button class="new-btn" id="newBtn" type="button">＋ 新对话</button>
    <div class="rail-label">最近</div>
    <ul class="convs" id="convs"></ul>
    <div class="rail-foot"><span id="countLabel"></span><button class="theme-btn" id="themeBtn" type="button">切换主题</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="打开对话列表">☰</button>
      <h2 id="title">新对话</h2>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <form class="composer-wrap" id="form">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="说点什么… （Enter 发送，Shift+Enter 换行）" aria-label="消息"></textarea>
        <button class="send" id="send" type="submit" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p class="hint" id="hint">对话记录只保存在你自己的浏览器里。</p>
    </form>
  </main>
</div>

<script>
(() => {
  const RULES = "你是一个友好、可靠的中文助手。回答简洁清楚，需要时使用 Markdown（列表、代码块）。不确定的事实要说明不确定，不要编造。";
  const STORE = "qingdeng.chats.v1";
  const $ = (id) => document.getElementById(id);
  const els = { app: $("app"), convs: $("convs"), thread: $("thread"), scroll: $("scroll"), input: $("input"), send: $("send"),
    form: $("form"), title: $("title"), status: $("status"), statusText: $("statusText"), count: $("countLabel") };

  // ---------- state ----------
  const uid = () => Math.random().toString(36).slice(2, 10);
  const example = () => ({
    id: uid(), title: "示例：周末去哪儿走走", example: true, updated: Date.now(),
    messages: [
      { role: "user", content: "周末想在城市附近轻松走走，有什么安排思路？", t: Date.now() - 120000 },
      { role: "assistant", t: Date.now() - 110000, content:
        "可以按**体力**和**时间**来挑：\n\n1. **半天城市散步**：选一条有咖啡馆和公园的街区，走 5–8 公里。\n2. **近郊徒步**：找评价里标注“新手友好”的步道，提前看天气。\n3. **骑行**：沿河或绿道，租车方便的路线最省心。\n\n> 这是一段示例对话。点左上角“新对话”就可以开始真正聊天。" }
    ]
  });
  let chats = load();
  let currentId = chats[0]?.id ?? null;
  let sample = null, busy = false, ctl = null;

  function load() {
    try { const v = JSON.parse(localStorage.getItem(STORE) || "null"); if (Array.isArray(v) && v.length) return v; } catch {}
    return [example()];
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(chats)); } catch {} }
  const current = () => chats.find(c => c.id === currentId);

  // ---------- tiny, escape-first markdown ----------
  const esc = (s) => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    const parts = esc(src).split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g);
    let html = "";
    parts.forEach((p, i) => {
      if (i % 2) { html += "<pre><code>" + p.replace(/\n$/, "") + "</code></pre>"; return; }
      const lines = p.split("\n"); let list = null, para = [];
      const flushP = () => { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
      const flushL = () => { if (list) { html += `<${list.t}>` + list.items.map(x => "<li>" + inline(x) + "</li>").join("") + `</${list.t}>`; list = null; } };
      for (const line of lines) {
        let m;
        if (!line.trim()) { flushP(); flushL(); continue; }
        if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
        if ((m = line.match(/^&gt;\s?(.*)/))) { flushP(); flushL(); html += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
        if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
          flushP(); const t = /\d/.test(m[1]) ? "ol" : "ul";
          if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
          list.items.push(m[2]); continue;
        }
        flushL(); para.push(line);
      }
      flushP(); flushL();
    });
    return html;
  }

  // ---------- render ----------
  const fmtTime = (t) => new Date(t).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  function renderList() {
    els.convs.textContent = "";
    [...chats].sort((a, b) => b.updated - a.updated).forEach(c => {
      const li = document.createElement("li"); li.className = "conv" + (c.id === currentId ? " active" : "");
      const open = document.createElement("button"); open.type = "button"; open.className = "open"; open.textContent = c.title;
      open.onclick = () => { currentId = c.id; els.app.classList.remove("drawer"); render(); };
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", "删除 " + c.title);
      del.onclick = () => removeChat(c.id);
      li.append(open, del); els.convs.append(li);
    });
    els.count.textContent = chats.length + " 段对话";
  }
  function bubble(m, i) {
    const row = document.createElement("div"); row.className = "msg " + (m.role === "user" ? "user" : "bot");
    const body = document.createElement("div"); body.className = "body";
    if (m.role === "user") { body.textContent = m.content; row.append(body); return row; }
    const seal = document.createElement("div"); seal.className = "seal"; seal.textContent = "言"; seal.setAttribute("aria-hidden", "true");
    const col = document.createElement("div"); col.style.minWidth = "0"; col.style.flex = "1";
    body.innerHTML = m.content ? md(m.content) : '<span class="thinking" aria-label="思考中"><i></i><i></i><i></i></span>';
    col.append(body);
    if (m.error) { const e = document.createElement("div"); e.className = "err"; e.textContent = m.error; col.append(e); }
    if (m.content && !m.pending) {
      const meta = document.createElement("div"); meta.className = "meta";
      const time = document.createElement("span"); time.textContent = fmtTime(m.t);
      const copy = document.createElement("button"); copy.type = "button"; copy.textContent = "复制";
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(m.content); copy.textContent = "已复制"; }
        catch { const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "已选中，按 Ctrl+C"; }
        setTimeout(() => copy.textContent = "复制", 1600);
      };
      meta.append(time, copy);
      const c = current();
      if (i === c.messages.length - 1 && !c.example && sample) {
        const re = document.createElement("button"); re.type = "button"; re.textContent = "重新生成"; re.onclick = regenerate; meta.append(re);
      }
      col.append(meta);
    }
    row.append(seal, col); return row;
  }
  function renderThread() {
    const c = current(); els.thread.textContent = "";
    els.title.textContent = c ? c.title : "新对话";
    if (!c || !c.messages.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.innerHTML = '<div class="seal" aria-hidden="true">言</div><h3>今天想聊点什么？</h3><p>问问题、改文案、写代码，都可以。</p><div class="chips"></div>';
      ["帮我把这段话改得更通顺", "用三句话解释什么是 VPN", "写一个 Python 读取 CSV 的例子", "给我一个周末学习计划"].forEach(t => {
        const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t;
        b.onclick = () => { els.input.value = t; syncInput(); els.input.focus(); };
        e.querySelector(".chips").append(b);
      });
      els.thread.append(e); return;
    }
    c.messages.forEach((m, i) => els.thread.append(bubble(m, i)));
    if (c.example) { const n = document.createElement("p"); n.className = "note"; n.textContent = "以上是示例对话，不是你的记录。"; els.thread.append(n); }
  }
  function render() { renderList(); renderThread(); toBottom(); }
  function toBottom() { requestAnimationFrame(() => { els.scroll.scrollTop = els.scroll.scrollHeight; }); }

  // ---------- actions ----------
  function newChat() {
    const c = { id: uid(), title: "新对话", updated: Date.now(), messages: [] };
    chats = chats.filter(x => x.messages.length);
    chats.push(c); currentId = c.id; save(); els.app.classList.remove("drawer"); render(); els.input.focus();
  }
  function removeChat(id) {
    chats = chats.filter(c => c.id !== id);
    if (!chats.length) chats.push({ id: uid(), title: "新对话", updated: Date.now(), messages: [] });
    if (currentId === id) currentId = [...chats].sort((a, b) => b.updated - a.updated)[0].id;
    save(); render();
  }
  async function ask(c) {
    const bot = { role: "assistant", content: "", t: Date.now(), pending: true };
    c.messages.push(bot); busy = true; syncInput(); renderThread(); toBottom();
    const botEl = els.thread.lastElementChild.querySelector(".body");
    const turns = c.messages.filter(m => !m.pending && m.content && !m.error).slice(-20).map(m => ({ role: m.role, content: m.content }));
    while (turns.length && turns[0].role !== "user") turns.shift();
    if (!sample) {
      await new Promise(r => setTimeout(r, 600));
      bot.content = "（演示模式）这个页面需要在 claude.ai 里打开，才能连上 Claude 真正回答。你刚才说的是：\n\n> " + turns.at(-1).content.slice(0, 200);
    } else {
      ctl = new AbortController();
      try {
        const res = await sample([{ role: "user", content: RULES }, ...turns], {
          cache: false, signal: ctl.signal,
          onText: ({ text }) => { bot.content = text; botEl.innerHTML = md(text); nearBottom(); }
        });
        bot.content = res.text;
        if (res.truncated) bot.error = "回答太长被截断了，可以让它“继续”。";
      } catch (e) {
        bot.content = e.text || "";
        const map = { not_granted: "你没有允许这个页面使用 Claude，刷新页面可以重新选择。", rate_limited: "请求太频繁或额度用完了，稍后再试。",
          session_expired: "登录已过期，请重新登录 claude.ai。", refused: "Claude 拒绝回答这条内容，换个问法试试。", cancelled: "" };
        const msg = e.code in map ? map[e.code] : "连接出错了，点“重新生成”再试一次。";
        if (msg) bot.error = msg;
        if (!bot.content && !msg) bot.content = "（已停止）";
        if (["not_granted", "sampling_disabled", "not_declared"].includes(e.code)) setLive(false);
      }
    }
    delete bot.pending; bot.t = Date.now(); c.updated = Date.now(); busy = false; ctl = null;
    if (!bot.content) bot.content = " ";
    save(); render(); syncInput();
  }
  function nearBottom() { const s = els.scroll; if (s.scrollHeight - s.scrollTop - s.clientHeight < 160) s.scrollTop = s.scrollHeight; }
  function send(text) {
    let c = current();
    if (!c || c.example) { newChat(); c = current(); }
    c.messages.push({ role: "user", content: text, t: Date.now() });
    if (c.title === "新对话") c.title = text.replace(/\s+/g, " ").slice(0, 24);
    c.updated = Date.now(); save(); renderList(); ask(c);
  }
  function regenerate() {
    const c = current(); if (busy || !c) return;
    if (c.messages.at(-1)?.role === "assistant") c.messages.pop();
    ask(c);
  }

  // ---------- input ----------
  function syncInput() {
    const el = els.input; el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 200) + "px";
    els.send.disabled = !busy && !el.value.trim();
    els.send.setAttribute("aria-label", busy ? "停止" : "发送");
    els.send.innerHTML = busy
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  }
  els.input.addEventListener("input", syncInput);
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); els.form.requestSubmit(); }
  });
  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) { ctl?.abort(); return; }
    const text = els.input.value.trim(); if (!text) return;
    els.input.value = ""; syncInput(); send(text);
  });
  $("newBtn").onclick = newChat;
  $("menuBtn").onclick = () => els.app.classList.add("drawer");
  $("scrim").onclick = () => els.app.classList.remove("drawer");
  $("themeBtn").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("qingdeng.theme", r.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem("qingdeng.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

  function setLive(on) {
    els.status.classList.toggle("live", on);
    els.statusText.textContent = on ? "已连接 Claude" : "演示模式";
  }

  render(); syncInput();
  (async () => {
    try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
    setLive(!!sample);
    if (!sample) $("hint").textContent = "演示模式：在 claude.ai 中打开此页面即可真正对话。记录只存在你的浏览器里。";
    renderThread();
  })();
})();
</script>
